name: CI

on:
  push:
    branches:
      - "feat/literacraft-*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Synthetic Literacraft demonstration
        run: npm run demo:synthetic

      - name: Station Reverse demonstration
        run: npm run demo:station-reverse
