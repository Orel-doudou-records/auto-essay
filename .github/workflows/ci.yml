name: CI

on:
  push:
    branches:
      - main
      - "feat/*"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test core
        run: npm run test

      - name: Test API
        run: npm run test:api

      - name: Test web
        run: npm run test:web

      - name: Build
        run: npm run build

      - name: Synthetic Literacraft demonstration
        run: npm run demo:synthetic

      - name: Station Reverse demonstration
        run: npm run demo:station-reverse

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
