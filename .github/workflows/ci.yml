name: CI

on:
  push:
    branches:
      - "feat/literacraft-*"
  pull_request:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Synthetic Literacraft demonstration
        run: npm run demo:synthetic

      - name: Station Reverse demonstration
        run: npm run demo:station-reverse

  gh-fix-ci-audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GitHub CLI authentication
        run: |
          gh --version
          gh auth status

      - name: Resolve PR metadata and current checks
        run: |
          gh pr view 29 --repo Orel-doudou-records/auto-essay --json number,url,state,mergedAt,headRefName,headRefOid,baseRefName
          gh pr checks 29 --repo Orel-doudou-records/auto-essay

      - name: Inspect historical failed run
        run: |
          gh run view 29430780094 --repo Orel-doudou-records/auto-essay --json name,workflowName,conclusion,status,url,event,headBranch,headSha
          gh run view 29430780094 --repo Orel-doudou-records/auto-essay --log-failed

      - name: Inspect successful replacement run
        run: gh run view 29431062984 --repo Orel-doudou-records/auto-essay --json name,workflowName,conclusion,status,url,event,headBranch,headSha
