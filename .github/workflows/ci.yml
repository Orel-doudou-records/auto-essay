name: CI

on:
  push:
    branches:
      - main
      - "feat/*"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pdf.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-pdf.txt

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test core
        run: npx vitest run

      - name: Test API
        run: npm run test:api

      - name: Diagnose scope workspace default
        if: always()
        run: npm run test -w @auto-essay/web -- src/routes/EditorPage.test.tsx -t "shows book structure and editorial context by default for the selected scope and lets the author collapse them"

      - name: Diagnose scope workspace hierarchy
        if: always()
        run: npm run test -w @auto-essay/web -- src/routes/EditorPage.test.tsx -t "selects chapters, sections and paragraphs from one visible manuscript hierarchy"

      - name: Test web
        if: always()
        run: npm run test:web

      - name: Build
        if: always()
        run: npm run build

      - name: Synthetic Literacraft demonstration
        if: always()
        run: npm run demo:synthetic

      - name: Station Reverse demonstration
        if: always()
        run: npm run demo:station-reverse

      - name: Security audit
        if: always()
        run: npm audit --audit-level=high
        continue-on-error: true
